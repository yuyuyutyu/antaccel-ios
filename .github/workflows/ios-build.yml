name: build-signed-ipa

on:
  workflow_dispatch:
    inputs:
      note:
        description: "备注(仅作记录)"
        required: false
        default: ""

env:
  P12_BASE64: ${{ secrets.P12_BASE64 }}
  P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
  PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          set -euo pipefail
          xcodebuild -version
          sw_vers
          echo "平台架构: $(uname -m)"

      - name: 编译未签名 IPA
        run: |
          set -euo pipefail
          chmod +x ios/scripts/build_unsigned_ipa.sh
          cd ios
          ./scripts/build_unsigned_ipa.sh "$GITHUB_WORKSPACE/AntiAccel-unsigned.ipa"

      - name: 上传未签名 IPA
        uses: actions/upload-artifact@v4
        with:
          name: AntiAccel-unsigned-ipa
          path: AntiAccel-unsigned.ipa
          if-no-files-found: error

      - name: 落盘证书与描述文件
        if: env.P12_BASE64 != '' && env.PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          mkdir -p signing
          printf '%s' "$P12_BASE64" | base64 --decode > signing/cert.p12
          printf '%s' "$PROFILE_BASE64" | base64 --decode > signing/profile.mobileprovision
          ls -l signing

      - name: 编译 + p12 重签
        if: env.P12_BASE64 != '' && env.PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          chmod +x ios/scripts/build_signed_ipa.sh
          cd ios
          ./scripts/build_signed_ipa.sh \
            -k "$GITHUB_WORKSPACE/signing/cert.p12" \
            -m "$GITHUB_WORKSPACE/signing/profile.mobileprovision" \
            -o "$GITHUB_WORKSPACE/AntiAccel.ipa"

      - name: 上传已签名 IPA
        if: env.P12_BASE64 != '' && env.PROFILE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: AntiAccel-signed-ipa
          path: AntiAccel.ipa
          if-no-files-found: error

      - name: 清理证书
        if: always()
        run: |
          rm -rf signing || true
