name: AntiAccel
options:
  bundleIdPrefix: com.arknet
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  AntiAccel:
    type: application
    platform: iOS
    sources:
      - path: AntiAccel/Sources
      - path: AntiAccel/Resources
      - path: AntiAccel/Assets.xcassets
      - path: AntiAccel/LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_NAME: AntiAccel
        PRODUCT_MODULE_NAME: AntiAccel
        PRODUCT_BUNDLE_IDENTIFIER: com.arknet.shell
        INFOPLIST_FILE: AntiAccel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.5"
        CURRENT_PROJECT_VERSION: "4"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
